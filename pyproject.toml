[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-guard"
version = "0.1.0"
description = "A lightweight local pre-commit hook to prevent accidental secret leaks."
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
repo-guard = "guard:cli"

[tool.setuptools]
py-modules = ["guard", "scanner", "rules", "git_hooks", "findings"]
